<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counselling Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#F8F9F7;--ink:#13231D;--ink2:#2E3D37;--muted:#64716B;--line:#DCE1DD;--line2:#EAEDEA;
  --accent:#0F6B47;--accent-h:#0B5A3B;--accent-ink:#FFFFFF;--accent-soft:#E3EFE8;--brass:#A6761A;--brass-soft:#F5EBD3;--danger:#A8322A;--danger-soft:#F8E4E1;
  --c0:#D7EADD;--c1:#DBE4F1;--c2:#F0E5CD;--c3:#E6DCEF;--c4:#F1DBDF;--c5:#D5EAE9;
  --sh1:0 1px 2px rgba(19,35,29,.06);--sh2:0 10px 30px -12px rgba(19,35,29,.22);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1411;--surface:#141D19;--surface2:#18231E;--ink:#E7EDEA;--ink2:#C9D3CE;--muted:#93A19A;--line:#27332E;--line2:#1F2A25;
  --accent:#55C08A;--accent-h:#6FD09F;--accent-ink:#06210F;--accent-soft:#16352A;--brass:#E2B04F;--brass-soft:#382B10;--danger:#F08A7E;--danger-soft:#3A1916;
  --c0:#1B3527;--c1:#1B2A3E;--c2:#382E19;--c3:#2D2440;--c4:#3B1F27;--c5:#173434;--sh1:none;--sh2:0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411;--surface:#141D19;--surface2:#18231E;--ink:#E7EDEA;--ink2:#C9D3CE;--muted:#93A19A;--line:#27332E;--line2:#1F2A25;
  --accent:#55C08A;--accent-h:#6FD09F;--accent-ink:#06210F;--accent-soft:#16352A;--brass:#E2B04F;--brass-soft:#382B10;--danger:#F08A7E;--danger-soft:#3A1916;
  --c0:#1B3527;--c1:#1B2A3E;--c2:#382E19;--c3:#2D2440;--c4:#3B1F27;--c5:#173434;--sh1:none;--sh2:0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted)}

/* Header + stepper */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 28px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:21px;font-weight:600;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.005em}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{max-width:1440px;margin:0 auto;padding:0 28px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper ol{list-style:none;display:flex;margin:0;padding:0;counter-reset:s;gap:0}
.stepper li{counter-increment:s;display:flex;align-items:center}
.stepper li+li::before{content:"";width:28px;height:1px;background:var(--line);margin:0 4px}
.stepper button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 10px 13px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
.stepper button::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--surface)}
.stepper button.done::before{content:"✓";border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stepper button.on{color:var(--ink);border-bottom-color:var(--accent)}
.stepper button.on::before{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.3;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted);background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger)}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);min-width:0;transition:border-color .15s}
.input:hover{border-color:var(--muted)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm{padding:5px 9px;font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.toggle{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--sh1);transition:transform .15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(16px)}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.optline{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.optline:first-child{border-top:0;padding-top:0}
.optline b{display:block;font-weight:600}
.optline .muted{font-size:13.5px}

/* Page */
main{max-width:1440px;margin:0 auto;padding:34px 28px 80px}
.pagehead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.pagehead>div:first-child{flex:1 1 380px;min-width:0}
h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.1;letter-spacing:-.015em;margin:0 0 8px}
.lead{color:var(--muted);margin:0;max-width:68ch;font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1)}
.section{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;padding:26px 28px;border-top:1px solid var(--line2)}
.section:first-child{border-top:0}
.section h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;margin:0 0 6px}
.section .desc{color:var(--muted);font-size:14px;margin:0}
.section .desc+.desc{margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.badge.warn{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.badge.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 6px 5px 13px;font-weight:600;font-size:14px;border:1px solid transparent}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;padding:0 5px;border-radius:50%}
.chip button:hover{color:var(--danger)}
.addrow{display:inline-flex;gap:6px}
.notice{border-radius:11px;padding:12px 16px;margin:0 0 16px;font-size:14.5px;border:1px solid transparent}
.notice.w{background:var(--brass-soft);color:var(--ink)}
.notice.e{background:var(--danger-soft)}
.notice.i{background:var(--accent-soft)}
.notice ul{margin:6px 0 0;padding-left:20px}
.notice b{font-weight:600}

/* Upload */
.uploads{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.drop{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;min-height:210px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--surface2)}
.drop.loaded{border-style:solid}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop h3{font-family:var(--serif);font-weight:500;font-size:23px;margin:0}
.drop p{margin:0;color:var(--muted);font-size:14px;max-width:52ch}
.drop .status{margin-top:auto;padding-top:14px;border-top:1px solid var(--line2);font-size:14px}
.drop .status b{font-weight:600}
.fileic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* Tables */
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--brass)}
td .input{width:100%}
.num{text-align:right}

/* Rules */
.rules{display:flex;flex-direction:column;gap:12px}
.rule{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:start}
.rule.off{opacity:.6}
.rule .order{font-family:var(--serif);font-size:22px;line-height:1;color:var(--muted);width:26px;text-align:center;padding-top:6px}
.rule .body{display:flex;flex-direction:column;gap:9px;min-width:0}
.rule .sent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14.5px;color:var(--ink2)}
.rule .sent .input{max-width:100%}
.rule .name{font-weight:600;border-color:transparent;padding-left:0;font-size:15.5px;width:100%}
.rule .name:hover{border-color:var(--line);padding-left:11px}
.rule .name:focus{padding-left:11px}
.rule .acts{display:flex;gap:4px;align-items:center}

/* Schedule */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;border:1px solid var(--line);border-radius:14px;background:var(--line2);margin-bottom:22px;overflow:hidden}
.kpi{padding:18px 22px;background:var(--surface)}
.kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:40px;line-height:1;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:2px;margin:0 0 18px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);border-radius:8px;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--sh1)}
.board{display:grid;grid-template-columns:76px repeat(6,minmax(178px,1fr));min-width:1170px}
.board .dh{padding:14px 12px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.board .dh:first-child{border-left:0}
.board .dh b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.1}
.board .dh small{color:var(--muted);font-size:12.5px}
.board .sh{padding:12px 12px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:1px;background:var(--surface2)}
.board .sh b{font-weight:700;font-size:15px}
.board .sh small{color:var(--muted);font-size:12px}
.board .cell{border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px;display:flex;flex-direction:column;gap:6px}
.tile{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:0 8px;align-items:center;padding:7px 9px 7px 7px;border-radius:9px;border:1px solid transparent;text-align:left;cursor:pointer;width:100%;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.tile .cab{grid-row:span 2;width:28px;height:28px;border-radius:7px;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.tile .who{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .who small{font-weight:500;color:var(--ink2);font-size:12.5px}
.tile .n{grid-row:span 2;min-width:28px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.tile .meta{font-size:12px;color:var(--ink2);opacity:.85;line-height:1.35}
.tile.moved{border-color:var(--brass)}
.tile.moved .meta b{color:var(--brass);font-weight:700}
.tile.manual{border-color:var(--accent)}
.tile.free{display:block;cursor:default;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:12.5px;padding:7px 10px}
.tile.free:hover{box-shadow:none;transform:none}
.empty{padding:48px 32px;text-align:center}
.setup{display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px)}
.toc ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:6px 0 6px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.toc a:hover{color:var(--ink);border-left-color:var(--muted)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.group{margin-bottom:40px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
.section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
.gh{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.gd{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.setup .section{grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:24px}
.setup .rule .sent input.input{width:130px!important}
.calcbar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 20px;box-shadow:var(--sh2);flex-wrap:wrap}
.calcbar b{display:block;font-weight:600}
.calcbar span{font-size:14px}
.empty h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 6px}

/* Sheet (edit panel) */
dialog.sheet{margin:0 0 0 auto;height:100%;max-height:100%;width:min(440px,100vw);border:0;border-left:1px solid var(--line);padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog.sheet[open]{animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(9,18,14,.38)}
dialog form{display:flex;flex-direction:column;height:100%}
.sheet .hd{padding:calc(22px + env(safe-area-inset-top,0px)) 24px 16px;border-bottom:1px solid var(--line2)}
.sheet .hd h3{font-family:var(--serif);font-weight:500;font-size:26px;margin:0}
.sheet .bd{padding:20px 24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.sheet .ft{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid3 .input{width:100%}
.check{border-radius:10px;padding:12px 14px;background:var(--surface2);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;background:rgba(9,18,14,.3);display:none;place-items:center;z-index:40;backdrop-filter:blur(2px)}
.busy.show{display:grid}
.busy div{background:var(--surface);padding:18px 26px;border-radius:12px;font-weight:600;border:1px solid var(--line);box-shadow:var(--sh2);display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrollbox{max-height:440px}
@media (max-width:1080px){ .setup{grid-template-columns:minmax(0,1fr)} .toc{display:none} }
@media (max-width:900px){
  .section{grid-template-columns:minmax(0,1fr);gap:14px;padding:22px 18px}
  .bar,.stepper{padding-left:16px;padding-right:16px}
  main{padding:24px 16px 70px}
  h1{font-size:30px}
  .kpi{padding:14px 16px}.kpi b{font-size:30px}
  .brand span{display:none}
}
@media (max-width:640px){ .rule{grid-template-columns:auto minmax(0,1fr)} .rule .acts{grid-column:2} .rule .sent select.input,.rule .sent input.input{width:100%!important} }
@media (max-width:520px){ .grid3{grid-template-columns:1fr 1fr} .calc-label{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z8bnq9rhe1");
</script>
</head>
<body>
<header class="appbar">
  <div class="bar">
    <div class="mark" aria-hidden="true">C</div>
    <div class="brand"><b>Counselling Planner</b><span id="weekLabel">No week loaded</span></div>
    <button class="btn ghost icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="btn primary" id="calcBtn" type="button" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg><span class="calc-label" id="calcLabel">Calculate schedule</span></button>
  </div>
  <nav class="stepper" aria-label="Steps"><ol>
    <li><button type="button" data-step="0">Set up</button></li>
    <li><button type="button" data-step="1">Weekly schedule</button></li>
  </ol></nav>
</header>
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>/* MCS Counselling Planner – scheduling engine (browser + Node) */
(function (root) {
  'use strict';
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const SLOTS = ['M1', 'M2', 'M3', 'E1', 'E2', 'E3'];
  const COUNSEL_SHIFTS = ['M2', 'M3', 'E2', 'E3'];
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

  function defaultRules() {
    return [
      { id: 'r1', name: 'Teaches the batch', on: true, tType: 'all', tValue: '', sType: 'taught', sValue: '' },
      { id: 'r2', name: 'Same class group', on: true, tType: 'all', tValue: '', sType: 'group', sValue: '' }
    ];
  }
  const activeShifts = st => SLOTS.filter(s => st.counselShifts ? st.counselShifts[s] : COUNSEL_SHIFTS.includes(s));
  const moveShifts = st => activeShifts(st).filter(s => !st.autoMoveShifts || st.autoMoveShifts[s]);
  const list = v => S(v).split(/[,\n]/).map(S).filter(Boolean);

  function defaultSettings(master) {
    return {
      weekStart: '',
      cabins: ['20', '21', '22'],
      keyword: 'Counselling',
      shifts: { M1: ['07:00', '08:45'], M2: ['09:00', '10:45'], M3: ['11:00', '12:45'], E1: ['14:00', '15:45'], E2: ['16:00', '17:45'], E3: ['18:00', '19:45'] },
      counselShifts: { M1: false, M2: true, M3: true, E1: false, E2: true, E3: true },
      autoMoveShifts: { M1: false, M2: true, M3: true, E1: false, E2: true, E3: true },
      baseStudents: 9,
      reduceBuildings: ['M3', 'M3 old', 'M4', 'GP'],
      knownBuildings: ['M1', 'M2', 'M3', 'M4', 'MHS2', 'GP', 'PC'],
      checks: { M1: { before: '', after: 'M2' }, M2: { before: 'M1', after: 'M3' }, M3: { before: 'M2', after: '' }, E1: { before: '', after: 'E2' }, E2: { before: 'E1', after: 'E3' }, E3: { before: 'E2', after: '' } },
      pcVenueBuilding: 'PC',
      classGroups: '11th | Target, 12th',
      moveOverflow: true,
      noRepeatTeacher: true,
      oppositeShiftOnly: true,
      minGapDays: 0,
      rules: defaultRules(),
      batchBuildings: (master && master.batchBuildings) || {},
      teachers: (master && master.teachers) || {}
    };
  }

  /* ---------- helpers ---------- */
  const toSec = t => { const m = /^(\d{1,2}):(\d{2})/.exec(S(t)); return m ? (+m[1]) * 3600 + (+m[2]) * 60 : 0; };
  const hm = s => String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  function excelDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
    if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); }
    const s = S(v); let m;
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return new Date(Date.UTC(+m[1], m[2] - 1, +m[3]));
    if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s))) { const y = +m[3] < 100 ? 2000 + (+m[3]) : +m[3]; return new Date(Date.UTC(y, m[2] - 1, +m[1])); }
    return null;
  }
  const iso = d => d ? d.toISOString().slice(0, 10) : '';
  function addDays(isoStr, n) { const d = new Date(isoStr + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); }

  /* ---------- timetable ---------- */
  function parseTimetable(rows) {
    const warnings = [];
    let hdr = -1;
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const row = rows[r] || [];
      if (/^teacher$/i.test(S(row[0])) && row.some(v => /^M1$/i.test(S(v)))) { hdr = r; break; }
    }
    if (hdr < 0) throw new Error('Could not find the header row. The timetable needs a row starting with "Teacher" followed by M1, M2, M3, E1, E2, E3 for each day.');
    const header = rows[hdr], dayRow = rows[hdr - 1] || [];
    const cols = []; let curDay = null, dayIdx = -1;
    for (let c = 1; c < header.length; c++) {
      const dv = S(dayRow[c]).toLowerCase();
      const di = DAYS.findIndex(d => dv.startsWith(d.slice(0, 3).toLowerCase()));
      if (di >= 0) { curDay = DAYS[di]; dayIdx = di; }
      const sl = S(header[c]).toUpperCase();
      if (SLOTS.includes(sl) && curDay) cols.push({ c, day: curDay, slot: sl });
    }
    if (!cols.length) throw new Error('No day columns found. Check that the row above the header names the days (Monday … Saturday).');
    let weekStart = '';
    for (let r = 0; r < hdr; r++) {
      const txt = (rows[r] || []).map(S).join(' ');
      const m = /(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]{3})[a-z]*\.?\s+(\d{4})/.exec(txt);
      if (m && MONTHS[m[2].toLowerCase()] !== undefined) { weekStart = iso(new Date(Date.UTC(+m[3], MONTHS[m[2].toLowerCase()], +m[1]))); break; }
    }
    const entries = [], teachers = [];
    for (let r = hdr + 1; r < rows.length; r++) {
      const row = rows[r] || []; const t = S(row[0]);
      if (!t || /^teacher$/i.test(t)) continue;
      const nxt = rows[r + 1] || []; const pair = r + 1 < rows.length && !S(nxt[0]);
      if (teachers.includes(t)) warnings.push(`Teacher ${t} appears twice in the timetable; both rows were read.`);
      teachers.push(t);
      for (const col of cols) {
        const subj = S(row[col.c]); const room = pair ? S(nxt[col.c]) : '';
        if (subj || room) entries.push({ t, day: col.day, slot: col.slot, subj, room });
      }
    }
    return { entries, teachers: [...new Set(teachers)], weekStart, warnings };
  }

  /* ---------- students / history ---------- */
  function findHeader(rows) {
    for (let r = 0; r < Math.min(rows.length, 6); r++) {
      const h = (rows[r] || []).map(v => S(v).toLowerCase());
      const roll = h.findIndex(x => /roll/.test(x)), batch = h.findIndex(x => /^batch/.test(x));
      if (roll >= 0 && batch >= 0) return { r, h };
    }
    return null;
  }
  function parseStudents(sheets, teacherCodes) {
    // sheets: [{name, rows}]
    const codes = new Set(teacherCodes);
    const out = []; const used = [];
    for (const sh of sheets) {
      const f = findHeader(sh.rows); if (!f) continue;
      const h = f.h;
      const ix = re => h.findIndex(x => re.test(x));
      const roll = ix(/roll/), batch = ix(/^batch/), name = ix(/name/), course = ix(/course|program/), date = ix(/^date/);
      const cands = h.map((x, i) => (/counsel|teacher/.test(x) ? i : -1)).filter(i => i >= 0);
      let cIdx = -1, best = -1;
      for (const ci of cands) {
        let hit = 0; for (let r = f.r + 1; r < Math.min(sh.rows.length, f.r + 400); r++) if (codes.has(S((sh.rows[r] || [])[ci]))) hit++;
        if (hit > best) { best = hit; cIdx = ci; }
      }
      let n = 0;
      for (let r = f.r + 1; r < sh.rows.length; r++) {
        const row = sh.rows[r] || []; const rl = S(row[roll]).replace(/\.0$/, ''); const b = S(row[batch]);
        if (!rl || !b || !/^\d+$/.test(rl)) continue;
        out.push({ roll: rl, name: S(row[name]), batch: b, course: course >= 0 ? S(row[course]) : '', date: date >= 0 ? excelDate(row[date]) : null, by: cIdx >= 0 ? S(row[cIdx]) : '' });
        n++;
      }
      used.push({ sheet: sh.name, rows: n, counsellorColumn: cIdx >= 0 ? S(sh.rows[f.r][cIdx]) : '(none)' });
    }
    return { records: out, used };
  }
  function buildStudents(records, weekStart) {
    const cut = weekStart ? new Date(weekStart + 'T00:00:00Z') : null;
    const st = new Map();
    for (const rec of records) {
      let s = st.get(rec.roll);
      const d = rec.date;
      if (!s) { s = { roll: rec.roll, name: rec.name, batch: rec.batch, course: rec.course, seen: d, hist: new Map() }; st.set(rec.roll, s); }
      else if (d && (!s.seen || d >= s.seen)) { s.seen = d; s.batch = rec.batch; s.name = rec.name || s.name; s.course = rec.course || s.course; }
      if (d && rec.by && (!cut || d < cut)) s.hist.set(iso(d), rec.by);
    }
    for (const s of st.values()) {
      const h = [...s.hist.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
      s.history = h.map(([date, by]) => ({ date, by }));
      s.times = h.length; s.last = h.length ? h[h.length - 1][0] : ''; s.teachersSeen = new Set(h.map(x => x[1]));
      delete s.hist;
    }
    return st;
  }

  /* ---------- core rules ---------- */
  function makeCtx(tt, settings) {
    const cell = new Map(); const occ = new Map();
    for (const e of tt.entries) {
      cell.set(e.t + '|' + e.day + '|' + e.slot, e);
      if (e.room) { if (!occ.has(e.room)) occ.set(e.room, new Set()); occ.get(e.room).add(e.day + '|' + e.slot); }
    }
    const kw = settings.keyword.toLowerCase();
    const isCounsel = e => (e.room + ' ' + e.subj).toLowerCase().includes(kw);
    const isDoubt = room => /dbt|doubt/i.test(room);
    const known = new Set(settings.knownBuildings); const reduce = new Set(settings.reduceBuildings);
    function building(code) {
      const x = S(code); if (!x) return null;
      if (x.toLowerCase().startsWith('m3 old')) return 'M3 old';
      const first = x.split(/\s+/)[0]; if (known.has(first)) return first;
      return settings.batchBuildings[x] || null;
    }
    const slotLen = sl => toSec(settings.shifts[sl][1]) - toSec(settings.shifts[sl][0]);
    const unit = sl => slotLen(sl) / settings.baseStudents;
    function compute(t, day, sl) {
      const chk = (settings.checks && settings.checks[sl]) || {}; let bf = false, af = false; const why = [];
      for (const [dir, adj] of [['before', chk.before], ['after', chk.after]]) {
        if (!adj) continue; const e = cell.get(t + '|' + day + '|' + adj);
        if (!e || !e.room || isCounsel(e)) continue; const b = building(e.room);
        if (b && reduce.has(b)) { why.push(`${adj} ${e.room} in ${b} (${dir}) −1`); if (dir === 'before') bf = true; else af = true; }
      }
      const k = settings.baseStudents - (bf ? 1 : 0) - (af ? 1 : 0);
      const st = toSec(settings.shifts[sl][0]) + (bf ? unit(sl) : 0);
      const en = af ? st + unit(sl) * k : toSec(settings.shifts[sl][1]);
      let venue = 'M1 Building';
      for (const adj of [chk.before, chk.after]) { if (!adj) continue; const e = cell.get(t + '|' + day + '|' + adj); if (e && building(e.room) === settings.pcVenueBuilding) { venue = 'PC Campus'; break; } }
      return { k, start: st, end: en, rule: why.join('; ') || 'No reduction', venue };
    }
    const teacherFree = (t, day, sl) => !cell.has(t + '|' + day + '|' + sl);
    return { cell, occ, isCounsel, isDoubt, building, compute, teacherFree, unit };
  }

  function workload(tt, ctx, plan) {
    const w = {};
    for (const e of tt.entries) {
      if (ctx.isCounsel(e)) continue;
      const x = w[e.t] || (w[e.t] = { perDay: Object.fromEntries(DAYS.map(d => [d, 0])), regular: 0, doubt: 0, counselling: 0 });
      x.perDay[e.day]++; if (ctx.isDoubt(e.room)) x.doubt++; else x.regular++;
    }
    for (const p of plan) { const x = w[p.t] || (w[p.t] = { perDay: Object.fromEntries(DAYS.map(d => [d, 0])), regular: 0, doubt: 0, counselling: 0 }); x.counselling++; }
    for (const t in w) w[t].total = w[t].regular + w[t].doubt + w[t].counselling;
    return w;
  }

  /* Step 1+2: counselling slots, overflow moves, cabins, student counts */
  function buildPlan(tt, settings) {
    const ctx = makeCtx(tt, settings); const cabins = settings.cabins.filter(Boolean); const warnings = [];
    const SH = activeShifts(settings), MV = moveShifts(settings);
    let plan = tt.entries.filter(e => ctx.isCounsel(e) && SH.includes(e.slot))
      .map((e, i) => ({ id: 'p' + i, t: e.t, origDay: e.day, origShift: e.slot, day: e.day, shift: e.slot, label: e.room || e.subj, moved: false, manual: false }));
    tt.entries.filter(e => ctx.isCounsel(e) && !SH.includes(e.slot)).forEach(e => warnings.push(`${e.t} has a counselling cell on ${e.day} ${e.slot}, but ${e.slot} is switched off for counselling, so it was skipped.`));
    const at = (d, s) => plan.filter(p => p.day === d && p.shift === s);
    const moves = [];
    if (settings.moveOverflow) {
      for (let guard = 0; guard < 500; guard++) {
        let over = null;
        for (const d of DAYS) for (const s of SH) if (!over && at(d, s).length > cabins.length) over = [d, s];
        if (!over) break;
        const [d, s] = over; let best = null;
        for (const p of at(d, s)) for (const d2 of DAYS) for (const s2 of MV) {
          if ((d2 === d && s2 === s) || at(d2, s2).length >= cabins.length || !ctx.teacherFree(p.t, d2, s2)) continue;
          if (plan.some(q => q.t === p.t && q.day === d2 && q.shift === s2)) continue;
          const same = plan.some(q => q !== p && q.t === p.t && q.day === d2) ? 1 : 0;
          const key = [Math.abs(DAYS.indexOf(d2) - DAYS.indexOf(d)), same, -ctx.compute(p.t, d2, s2).k, DAYS.indexOf(d2), SLOTS.indexOf(s2), p.t];
          if (!best || cmp(key, best.key) < 0) best = { key, p, d2, s2 };
        }
        if (!best) { warnings.push(`${d} ${s} has ${at(d, s).length} teachers but only ${cabins.length} cabins, and no free cabin fits their timetables. Move one manually.`); break; }
        moves.push({ t: best.p.t, from: `${d} ${s}`, to: `${best.d2} ${best.s2}` });
        Object.assign(best.p, { day: best.d2, shift: best.s2, moved: true });
      }
    }
    plan = finalizePlan(plan, tt, settings);
    return { plan, moves, warnings };
  }
  function cmp(a, b) { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; }

  /* assign cabins (respecting manual cabins), counts, times, dates */
  function finalizePlan(plan, tt, settings) {
    const ctx = makeCtx(tt, settings); const cabins = settings.cabins.filter(Boolean);
    for (const d of DAYS) for (const s of SLOTS) {
      const here = plan.filter(p => p.day === d && p.shift === s);
      const taken = new Set(here.filter(p => p.manual && p.cabin && cabins.includes(p.cabin)).map(p => p.cabin));
      const free = cabins.filter(c => !taken.has(c));
      here.filter(p => !(p.manual && p.cabin && cabins.includes(p.cabin))).sort((a, b) => a.t < b.t ? -1 : 1)
        .forEach(p => { p.cabin = free.shift() || ''; });
    }
    for (const p of plan) {
      const c = ctx.compute(p.t, p.day, p.shift);
      p.k = p.manualK != null ? p.manualK : c.k; p.start = c.start; p.end = p.manualK != null ? c.start + ctx.unit(p.shift) * p.manualK : c.end;
      if (p.manualK == null) p.end = c.end;
      p.rule = p.manualK != null ? `Set manually to ${p.manualK}` : `${c.k} students · ${c.rule}`; p.venue = c.venue;
      p.date = settings.weekStart ? addDays(settings.weekStart, DAYS.indexOf(p.day)) : '';
      p.unit = ctx.unit(p.shift);
    }
    plan.sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || SLOTS.indexOf(a.shift) - SLOTS.indexOf(b.shift) || (a.cabin < b.cabin ? -1 : a.cabin > b.cabin ? 1 : 0));
    return plan;
  }

  function validatePlan(plan, tt, settings) {
    const ctx = makeCtx(tt, settings); const out = []; const cabins = settings.cabins.filter(Boolean);
    for (const d of DAYS) for (const s of SLOTS) {
      const here = plan.filter(p => p.day === d && p.shift === s);
      if (here.length > cabins.length) out.push(`${d} ${s}: ${here.length} teachers for ${cabins.length} cabins.`);
      const seen = {}; here.forEach(p => { if (p.cabin) { if (seen[p.cabin]) out.push(`${d} ${s}: cabin ${p.cabin} has both ${seen[p.cabin]} and ${p.t}.`); seen[p.cabin] = p.t; } else out.push(`${d} ${s}: ${p.t} has no cabin.`); });
    }
    for (const p of plan) if (p.moved || p.manual) { const e = ctx.cell.get(p.t + '|' + p.day + '|' + p.shift); if (e && !ctx.isCounsel(e)) out.push(`${p.t} has a class (${e.subj} ${e.room}) on ${p.day} ${p.shift}, the time of their counselling slot.`); }
    return out;
  }

  /* Step 3+4: match students */
  function assignStudents(plan, tt, settings, students) {
    const ctx = makeCtx(tt, settings);
    const groups = settings.classGroups.split('|').map(g => g.split(',').map(S).filter(Boolean));
    const groupOf = cls => { const i = groups.findIndex(g => g.includes(cls)); return i < 0 ? 'cls:' + cls : 'g' + i; };
    const tcls = t => (settings.teachers[t] && settings.teachers[t].cls) || '';
    // batch class = majority class of teachers teaching its regular classes
    const votes = {};
    for (const e of tt.entries) {
      if (!e.room || ctx.isCounsel(e) || ctx.isDoubt(e.room)) continue; const c = tcls(e.t); if (!c) continue;
      (votes[e.room] = votes[e.room] || {})[c] = (votes[e.room][c] || 0) + 1;
    }
    const batchCls = {}; for (const b in votes) batchCls[b] = Object.entries(votes[b]).sort((a, b2) => b2[1] - a[1])[0][0];
    const byBatch = new Map(); for (const s of students.values()) { if (!byBatch.has(s.batch)) byBatch.set(s.batch, []); byBatch.get(s.batch).push(s); }
    for (const arr of byBatch.values()) arr.sort((a, b) => (a.last || '') < (b.last || '') ? -1 : (a.last || '') > (b.last || '') ? 1 : (a.roll < b.roll ? -1 : 1));
    const classShifts = new Map();
    for (const [b, set] of ctx.occ) classShifts.set(b, new Set([...set].map(k => k.split('|')[1][0])));
    const opposite = settings.oppositeShiftOnly !== false;
    // a student is free when their batch has no class in that period and, if opposite-shift-only is on,
    // the counselling period is in the shift where the batch has no classes at all
    const freeAt = (b, d, sl) => ctx.occ.has(b) && !ctx.occ.get(b).has(d + '|' + sl) && (!opposite || !classShifts.get(b).has(sl[0]));
    const direct = {};
    for (const e of tt.entries) if (e.room && !ctx.isCounsel(e) && !ctx.isDoubt(e.room)) (direct[e.t] = direct[e.t] || new Set()).add(e.room);
    const used = new Set(); const assign = []; let repeatSkips = 0, gapSkips = 0; const count = new Map();
    const gapCut = settings.minGapDays > 0 && settings.weekStart ? addDays(settings.weekStart, -settings.minGapDays) : '';
    const shiftOf = b => { let m = 0, e = 0; (ctx.occ.get(b) || []).forEach(k => k.split('|')[1][0] === 'M' ? m++ : e++); return m >= e ? 'Morning' : 'Evening'; };
    function fill(p, batches, basis) {
      const pool = [];
      for (const b of batches) if (freeAt(b, p.day, p.shift)) for (const s of (byBatch.get(b) || [])) pool.push(s);
      pool.sort((a, b) => (a.last || '') < (b.last || '') ? -1 : (a.last || '') > (b.last || '') ? 1 : a.batch < b.batch ? -1 : a.batch > b.batch ? 1 : a.roll < b.roll ? -1 : 1);
      for (const s of pool) {
        if ((count.get(p.id) || 0) >= p.k) return;
        if (used.has(s.roll)) continue;
        if (gapCut && s.last && s.last >= gapCut) { gapSkips++; continue; }
        if (settings.noRepeatTeacher && s.teachersSeen.has(p.t)) { repeatSkips++; continue; }
        used.add(s.roll); count.set(p.id, (count.get(p.id) || 0) + 1); assign.push({ pid: p.id, s, basis });
      }
    }
    const allB = [...byBatch.keys()].filter(b => ctx.occ.has(b));
    const tMatch = (r, t) => {
      const v = list(r.tValue);
      if (r.tType === 'class') return v.includes(tcls(t));
      if (r.tType === 'codes') return v.includes(t);
      if (r.tType === 'subject') return v.map(x => x.toLowerCase()).includes(((settings.teachers[t] || {}).subject || '').toLowerCase());
      return true;
    };
    const pool = (r, t) => {
      const v = list(r.sValue);
      switch (r.sType) {
        case 'taught': return [...(direct[t] || [])].filter(b => byBatch.has(b));
        case 'group': { if (!tcls(t)) return []; const g = groupOf(tcls(t)); return allB.filter(b => batchCls[b] && groupOf(batchCls[b]) === g); }
        case 'class': return allB.filter(b => v.includes(batchCls[b]));
        case 'batches': return v.filter(b => byBatch.has(b));
        case 'prefix': return allB.filter(b => v.some(x => b.toUpperCase().startsWith(x.toUpperCase())));
        case 'any': return allB;
      }
      return [];
    };
    const rules = (settings.rules && settings.rules.length ? settings.rules : defaultRules()).filter(r => r.on);
    for (const r of rules) for (const p of plan) if (tMatch(r, p.t)) fill(p, pool(r, p.t), r.name || 'Rule');
    // times
    const byP = {}; assign.forEach(a => (byP[a.pid] = byP[a.pid] || []).push(a));

function render() {
  const s = st.settings;
  $('weekLabel').textContent = s.weekStart ? `Week of ${fmtShort(s.weekStart)} – ${fmtShort(E.addDays(s.weekStart, 5))} ${s.weekStart.slice(0, 4)}` : 'No week loaded';
  $('calcBtn').disabled = !ready(); $('calcLabel').textContent = st.plan ? 'Recalculate' : 'Calculate schedule';
  document.querySelectorAll('.stepper button').forEach(b => {
    const i = +b.dataset.step; b.classList.toggle('on', i === st.step);
    b.classList.toggle('done', i !== st.step && ((i === 0 && ready()) || (i === 1 && !!st.plan)));
    if (i === st.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  const y = window.scrollY;
  $('main').innerHTML = [viewSetup, viewSchedule][st.step]();
  bind(); if (st.step === 0) { window.scrollTo(0, y); markToc(); }
}

const cabColor = c => `var(${CABCOL[Math.max(0, st.settings.cabins.indexOf(c)) % 6]})`;
const firstName = t => tName(t).split(' ')[0];
function vBoard() {
  const s = st.settings, cnt = st.result.counts, SH = shifts();
  const extra = [...new Set(st.plan.map(p => p.shift))].filter(x => !SH.includes(x));
  const rows = E.SLOTS.filter(x => SH.includes(x) || extra.includes(x));
  let h = `<div class="legend"><span><i style="background:var(--brass)"></i>Moved from its timetable slot</span><span><i style="background:var(--accent)"></i>Edited by you</span><span>The number on each slot is students booked</span></div>
  <div class="boardwrap"><div class="board"><div class="dh"></div>${E.DAYS.map(d => `<div class="dh"><b>${d}</b><small>${fmtShort(dayDate(d))}</small></div>`).join('')}`;
  for (const sh of rows) {
    h += `<div class="sh"><b>${sh}</b><small>${s.shifts[sh][0]}–${s.shifts[sh][1]}</small></div>`;
    for (const d of E.DAYS) {
      const here = st.plan.filter(p => p.day === d && p.shift === sh); h += `<div class="cell">`;
      if (!here.length) { h += `<span class="tile free">${s.cabins.length > 1 ? `All ${s.cabins.length} cabins free` : 'Cabin free'}</span></div>`; continue; }
      for (const c of s.cabins) {
        const p = here.find(x => x.cabin === c);
        if (!p) { h += `<span class="tile free">Cabin ${esc(c)} free</span>`; continue; }
        h += `<button type="button" class="tile ${p.manual ? 'manual' : p.moved ? 'moved' : ''}" style="background:${cabColor(c)}" data-pid="${p.id}" aria-label="${esc(p.t)}, cabin ${esc(c)}, ${d} ${sh}, ${cnt[p.id] || 0} students. Edit">
          <span class="cab">${esc(c)}</span><span class="who">${esc(p.t)} <small>${esc(firstName(p.t))}</small></span><span class="n">${cnt[p.id] || 0}</span>
          <span class="meta">${p.moved ? `<b>From ${p.origDay.slice(0, 3)} ${p.origShift}</b> · ` : ''}${E.hm(p.start)}–${E.hm(p.end)}</span></button>`;
      }
      here.filter(p => !p.cabin || !s.cabins.includes(p.cabin)).forEach(p => { h += `<button type="button" class="tile" style="background:var(--danger-soft)" data-pid="${p.id}"><span class="cab">!</span><span class="who">${esc(p.t)}</span><span class="n">${cnt[p.id] || 0}</span><span class="meta">No free cabin</span></button>`; });
      h += `</div>`;
    }
  }
  return h + `</div></div>`;
}

/* ---------- saving ---------- */
async function saveFile(name, data) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { try { await dl.save({ filename: name, data: data instanceof Blob ? data : new Blob([data]) }); toast('Saved'); } catch (e) { if (e && e.code !== 'declined') toast('The file could not be saved here.'); } return; }
    }
  } catch (e) {}
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    g.mergeCells(1, 1, 1, 3 + s.cabins.length); g.getCell(1, 1).value = `COUNSELLING CABIN SCHEDULE  ·  ${weekTxt}`; g.getCell(1, 1).font = { name: 'Arial', bold: true, size: 14, color: { argb: NAVY } };
    g.getCell(2, 1).value = 'One teacher per cabin per slot. Yellow = moved from the timetable slot.'; g.getCell(2, 1).font = { name: 'Arial', italic: true, size: 9, color: { argb: 'FF595959' } };
    [12, 8, 13].concat(s.cabins.map(() => 38)).forEach((w, i) => g.getColumn(i + 1).width = w);
    let gr = 4;

      for (const sh of SH) {
        const row = g.getRow(gr); row.height = 48;
        [d.slice(0, 3), sh, `${s.shifts[sh][0]}–${s.shifts[sh][1]}`].forEach((v, i) => { const c = row.getCell(i + 1); c.value = v; c.font = { name: 'Arial', size: 10, bold: i === 1 }; c.border = border; c.alignment = { horizontal: 'center', vertical: 'middle' }; });
        s.cabins.forEach((cab, j) => {
          const p = st.plan.find(x => x.day === d && x.shift === sh && x.cabin === cab), c = row.getCell(4 + j); c.border = border; c.alignment = { wrapText: true, vertical: 'middle' }; c.font = { name: 'Arial', size: 10, color: { argb: p ? 'FF000000' : 'FFA6A6A6' } };
          if (!p) { c.value = '— free —'; c.fill = cabFill(cab); return; }
          c.value = `${p.t} · ${tName(p.t)} (${tSub(p.t)})\n${E.hm(p.start)}–${E.hm(p.end)}  ·  ${cnt[p.id] || 0} students${p.moved ? `\n↻ moved from ${p.origDay.slice(0, 3)} ${p.origShift}` : ''}`;
          c.fill = p.moved ? solid(MOVED) : cabFill(cab);
        });
        gr++;
      }
      gr++;
    }
    const w = E.workload(st.tt, E.makeCtx(st.tt, s), st.plan), bat = {}; r.rows.forEach(x => { (bat[x.pid] = bat[x.pid] || {})[x.s.batch] = (bat[x.pid][x.s.batch] || 0) + 1; });
    sheet('Teacher Sessions', 'TEACHER-WISE COUNSELLING SESSIONS', `Week ${weekTxt}. Students per slot: ${s.baseStudents}, minus 1 for each neighbouring class in ${s.reduceBuildings.join(' / ')}.`,
      ['Sr.', 'Date', 'Day', 'Period', 'Cabin', 'Teacher Code', 'Teacher Name', 'Subject', 'Class', 'Start', 'End', 'Students Assigned', 'Weekly Workload (Slots)', 'Student-Count Rule', 'Venue', 'Slot Moved From', 'Batches'],
      [6, 11, 11, 7, 7, 9, 20, 10, 9, 8, 8, 10, 11, 36, 13, 14, 30],
      st.plan.map((p, i) => [i + 1, fmtDate(p.date), p.day, p.shift, p.cabin, p.t, tName(p.t), tSub(p.t), tCls(p.t), E.hm(p.start), E.hm(p.end), cnt[p.id] || 0, w[p.t] ? w[p.t].total : '', p.rule, p.venue, p.moved ? `${p.origDay.slice(0, 3)} ${p.origShift}` : '—', Object.entries(bat[p.id] || {}).map(([b, n]) => `${b} (${n})`).join(', ')]),
      { left: [6, 13, 16], bold: [11, 12], style: (row, i) => { const p = st.plan[i]; row.getCell(5).fill = cabFill(p.cabin); if (p.moved) row.getCell(16).fill = solid(MOVED); } });
    sheet('Student Assignments', 'STUDENT-WISE COUNSELLING ASSIGNMENTS', 'Key columns first. No student is given a teacher who has counselled them before.',
      ['Sr.', 'Student Name', 'Teacher Name', 'Cabin', 'Date', 'Time', 'Last Counselled', 'Times Counselled Before', 'Previously Counselled By', 'Roll No.', 'Batch', 'Day', 'Period', 'Teacher Code', 'Subject', 'Course', 'Batch Class Shift', 'Matched By'],
      [6, 26, 20, 7, 11, 8, 13, 11, 28, 11, 8, 11, 7, 9, 10, 13, 10, 24],
      r.rows.map((x, i) => [i + 1, x.s.name, tName(x.p.t), x.p.cabin, fmtDate(x.p.date), x.time, x.s.last ? fmtDate(x.s.last) : 'Never', x.s.times, x.s.history.map(h => `${h.by} (${h.date.slice(8, 10)}-${h.date.slice(5, 7)})`).join(', ') || '—', x.s.roll, x.s.batch, x.p.day, x.p.shift, x.p.t, tSub(x.p.t), x.s.course, x.batchShift, x.basis]),
      { key: 9, xSplit: 2, left: [1, 2, 8, 17], bold: [1, 2], style: (row, i) => { row.getCell(4).fill = cabFill(r.rows[i].p.cabin); } });
    const tlist = [...new Set(st.plan.map(p => p.t))].sort((a, b) => (tCls(a) + tSub(a) + a) < (tCls(b) + tSub(b) + b) ? -1 : 1), sc = {}; r.rows.forEach(x => sc[x.p.t] = (sc[x.p.t] || 0) + 1);
    sheet('Teacher Workload', 'WEEKLY WORKLOAD · TEACHERS WITH COUNSELLING SLOTS', 'Total slots = regular classes + doubt classes + counselling slots. Day columns include counselling.',
      ['Code', 'Teacher Name', 'Subject', 'Class'].concat(E.DAYS.map(d => d.slice(0, 3)), ['Regular Classes', 'Doubt Classes', 'Counselling Slots', 'Total Slots (Week)', 'Students Assigned']),
      [8, 20, 10, 9, 6, 6, 6, 6, 6, 6, 10, 10, 11, 12, 11],
      tlist.map(t => [t, tName(t), tSub(t), tCls(t)].concat(E.DAYS.map(d => w[t].perDay[d] + st.plan.filter(p => p.t === t && p.day === d).length), [w[t].regular, w[t].doubt, w[t].counselling, w[t].total, sc[t] || 0])), { left: [1], bold: [13] });
    sheet('Rules Used', 'MATCHING RULES USED FOR THIS SCHEDULE', 'Rules run from top to bottom.', ['Order', 'Rule', 'On', 'Teachers', 'Students'], [7, 28, 6, 36, 44],
      s.rules.map((x, i) => [i + 1, x.name, x.on ? 'Yes' : 'No', (T_TYPES.find(t => t[0] === x.tType) || ['', ''])[1] + (x.tValue ? ': ' + x.tValue : ''), (S_TYPES.find(t => t[0] === x.sType) || ['', ''])[1] + (x.sValue ? ': ' + x.sValue : '')]), { left: [1, 3, 4] });
    sheet('Moves and Notes', 'SLOT MOVES AND NOTES', 'Moves were made because a period had more teachers than cabins.', ['Type', 'Detail'], [16, 110],
      st.moves.map(m => ['Moved', `${m.t} (${tName(m.t)}): ${m.from} → ${m.to}`]).concat(st.planWarnings.map(x => ['Note', x]), r.warnings.map(x => ['Note', x]), (r.invalid || []).map(x => ['Check', x])), { left: [1] });
    const buf = await wb.xlsx.writeBuffer();
    await saveFile(`Counselling_Schedule_${s.weekStart}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  } catch (e) { alert('The Excel file could not be built: ' + e.message); console.error(e); }
  busy(false);
}

/* ---------- start ---------- */
document.querySelectorAll('.stepper button').forEach(b => b.onclick = () => { st.step = +b.dataset.step; render(); scrollTo(0, 0); });
$('calcBtn').onclick = calculate;
function markToc() {
  if (st.step !== 0) return; const links = [...document.querySelectorAll('.toc a')]; if (!links.length) return;
  let cur = links[0]; for (const a of links) { const t = document.getElementById(a.getAttribute('href').slice(1)); if (t && t.getBoundingClientRect().top < 200) cur = a; }
  if (innerHeight + scrollY >= document.body.scrollHeight - 4) cur = links[links.length - 1];
  links.forEach(a => { a.classList.toggle('on', a === cur); if (a === cur) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current'); });
}
addEventListener('scroll', markToc, { passive: true });
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
let theme = null; try { theme = localStorage.getItem('mcs_planner_theme'); } catch (e) {} applyTheme(theme);
$('themeBtn').onclick = () => { const cur = document.documentElement.getAttribute('data-theme'), dark = cur === 'dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches); theme = dark ? 'light' : 'dark'; applyTheme(theme); try { localStorage.setItem('mcs_planner_theme', theme); } catch (e) {} };
(async function init() {
  st.settings = loadSettings(); render();
  if (!window.XLSX || !window.ExcelJS) $('main').insertAdjacentHTML('afterbegin', '<div class="notice e">The Excel libraries did not load. Check the internet connection and reload the page.</div>');
  const t = await idb.get('tt'); if (t) { st.tt = t.tt; st.ttName = t.name; }
  const r = await idb.get('rec'); if (r) { st.records = r.recs; st.recMeta = r.meta; st.recName = r.name; rebuildStudents(); }
  restoreEdits(); if (st.plan) st.step = 1; render();
})();
</script>
